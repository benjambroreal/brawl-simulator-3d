<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<link rel="stylesheet" href="style.css"/>
<style>
        canvas:focus {
            outline: none;
        }
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
            background-color: #000;
        }
        #loading-text {
            font-weight: bold;
            font-size: 48px;
            font-family: cursive;
            text-align: center;
            margin-top: 40px;
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 3s ease infinite;
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
</style>
</head>
<body class="dark">
    <div id="loading-text">LOADING ENGINE...</div>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        const loadingText = document.querySelector("#loading-text");
        
        async function fetchWithProgress(url, totalSizeMB) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to load structural block: ${url}`);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                chunks.push(value);
                
                let mbDone = (received / (1024 * 1024)).toFixed(2);
                loadingText.textContent = `LOADING... ${mbDone} MB / ${totalSizeMB} MB`;
            }
            
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }

        async function mergeFiles(fileParts, totalSizeMB) {
            const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part, totalSizeMB)));
            return URL.createObjectURL(new Blob(buffers));
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        (async () => {
            try {
                // Pointing locally to your server directories
                const [wasmUrl, dataUrl] = await Promise.all([
                    mergeFiles(getParts("Build/brawl.wasm", 1, 4), "64.20"),
                    mergeFiles(getParts("Build/brawl.data", 1, 2), "37.62")
                ]);

                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl: "Build/brawl.framework.js",
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Fire Games",
                    productName: "Brawl 2018",
                    productVersion: "1.07"
                };

                const script = document.createElement("script");
                script.src = "Build/brawl.loader.js";
                script.onload = () => {
                    createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
                        if(progress === 1) loadingText.style.display = "none";
                    }).catch((message) => {
                        alert(message);
                    });
                };
                document.body.appendChild(script);
            } catch (err) {
                loadingText.textContent = "Error: File missing from Build/ directory.";
                console.error(err);
            }
        })();
    </script>
</body>
</html>
